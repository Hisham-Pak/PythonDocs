name: Build Offline Python Docs

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *" # daily

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create/update the release

    steps:
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip jq curl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs zips + manifest.json
        env:
          OUT_DIR: out
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          REPO_URL="https://github.com/python/cpython.git"

          echo "Discovering CPython tags..." >&2
          TAGS=$(git ls-remote --tags "$REPO_URL" \
            | awk '{print $2}' \
            | sed 's#refs/tags/##' \
            | sed 's#\^{}##' \
            | grep -E '^v3\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' \
            | sort -V)

          # Unique series X.Y, filter >= 3.0 (then we will add 2.6/2.7 explicitly)
          SERIES=$(echo "$TAGS" \
            | awk -F. '{print $1"."$2}' \
            | sort -Vu \
            | awk -F. '($1>2)||($1==2&&$2>=6){print $0}')

          # Force include 2.6 and 2.7 (you said you need these)
          SERIES=$(printf "2.6\n2.7\n%s\n" "$SERIES" | awk '!seen[$0]++')

          echo "Series to process (>=2.6):" >&2
          echo "$SERIES" >&2

          # Stable Python 3 series detected from SERIES
          STABLE_3_SERIES="$(echo "$SERIES" | awk -F. '$1==3{print $0}' | tail -n 1)"
          if [ -z "${STABLE_3_SERIES:-}" ]; then
            echo "No Python 3 series found; aborting." >&2
            exit 1
          fi

          STABLE_MAJ="${STABLE_3_SERIES%%.*}"
          STABLE_MIN="${STABLE_3_SERIES#*.}"
          INFERRED_DEV_SERIES="${STABLE_MAJ}.$((STABLE_MIN + 1))"

          echo "Stable 3.x series: $STABLE_3_SERIES" >&2
          echo "Inferred dev series: $INFERRED_DEV_SERIES" >&2

          META="$OUT_DIR/meta.txt"
          : > "$META"

          # Get commit SHA for a tag (works for annotated/lightweight tags)
          sha_for_tag () {
            local TAG_NO_V="$1"
            local TAG="v${TAG_NO_V}"
            local SHA
            SHA=$(git ls-remote "$REPO_URL" "refs/tags/${TAG}^{}" | awk '{print $1}' || true)
            if [ -z "${SHA:-}" ]; then
              SHA=$(git ls-remote "$REPO_URL" "refs/tags/${TAG}" | awk '{print $1}' || true)
            fi
            echo "${SHA:-}"
          }

          sha_for_branch () {
            local BR="$1"
            git ls-remote "$REPO_URL" "refs/heads/${BR}" | awk '{print $1}' || true
          }

          latest_patch_for_series () {
            local SERIES="$1" # e.g. 3.12
            echo "$TAGS" | grep -E "^${SERIES}\.[0-9]+$" | tail -n 1 || true
          }

          # Pull the official HTML zip URL from the docs "download.html" page for a slug
          # Prints URL to stdout, or empty if not found.
          find_html_zip_url () {
            local SLUG="$1"

            local PAGE=""
            if [ "$SLUG" = "2.6" ]; then
              PAGE="https://docs.python.org/release/2.6/download.html"
            else
              PAGE="https://docs.python.org/${SLUG}/download.html"
            fi

            # download page html (follow redirects)
            local HTML
            HTML="$(curl -fsL "$PAGE" || true)"
            if [ -z "${HTML:-}" ]; then
              echo ""
              return
            fi

            # Try to find an absolute URL first
            local URL
            URL="$(printf "%s" "$HTML" | grep -oE 'https?://[^"]+docs-html\.zip' | head -n 1 || true)"
            if [ -n "${URL:-}" ]; then
              echo "$URL"
              return
            fi

            # Try relative href like "archives/python-3.4-docs-html.zip"
            local REL
            REL="$(printf "%s" "$HTML" | grep -oE 'href="[^"]*docs-html\.zip"' | head -n 1 | sed -E 's/^href="|"$//g' || true)"
            if [ -z "${REL:-}" ]; then
              echo ""
              return
            fi

            # Make absolute
            if [[ "$REL" =~ ^https?:// ]]; then
              echo "$REL"
              return
            fi

            # Relative to page directory
            if [ "$SLUG" = "2.6" ]; then
              echo "https://docs.python.org/release/2.6/${REL#./}"
            else
              echo "https://docs.python.org/${SLUG}/${REL#./}"
            fi
          }

          # Download and re-zip into your consistent asset name: python-docs-<slug>-en.zip
          # Writes ONE meta line: "<slug> <ref> <sha>" to stdout on success, nothing on skip.
          download_docs_zip () {
            local SLUG="$1" # "dev", "3", "3.12", "2.7", "2.6"
            local ZIP_NAME="python-docs-${SLUG}-en.zip"
            local OUT_PATH="${OUT_DIR}/${ZIP_NAME}"

            # Map "3" => download page at /3/download.html
            local DOC_SLUG="$SLUG"
            if [ "$SLUG" = "dev" ]; then
              DOC_SLUG="dev"
            elif [ "$SLUG" = "3" ]; then
              DOC_SLUG="3"
            fi

            local URL
            URL="$(find_html_zip_url "$DOC_SLUG")"
            if [ -z "${URL:-}" ]; then
              echo "Skipping $SLUG: could not find docs-html.zip URL" >&2
              return 0
            fi

            echo "=== $SLUG ===" >&2
            echo "URL: $URL" >&2

            # download to temp
            local TMP_ZIP="${OUT_DIR}/tmp-${SLUG}.zip"
            if ! curl -fL "$URL" -o "$TMP_ZIP"; then
              echo "Skipping $SLUG: download failed" >&2
              rm -f "$TMP_ZIP" || true
              return 0
            fi

            # Normalize: re-zip contents into python-docs-<slug>-en.zip
            rm -rf "${OUT_DIR}/tmp-${SLUG}"
            mkdir -p "${OUT_DIR}/tmp-${SLUG}"
            unzip -q "$TMP_ZIP" -d "${OUT_DIR}/tmp-${SLUG}"

            # Many python doc zips contain a top-level dir; zip the contents of the extracted tree
            # Prefer the first directory if present
            local ROOT="${OUT_DIR}/tmp-${SLUG}"
            local FIRST_DIR
            FIRST_DIR="$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
            if [ -n "${FIRST_DIR:-}" ]; then
              ROOT="$FIRST_DIR"
            fi

            (cd "$ROOT" && zip -qr "../../../${OUT_PATH}" .) >&2

            rm -f "$TMP_ZIP" || true
            rm -rf "${OUT_DIR}/tmp-${SLUG}" || true

            local REF=""
            local SHA=""

            if [ "$SLUG" = "dev" ]; then
              REF="main"
              SHA="$(sha_for_branch main)"
            elif [ "$SLUG" = "3" ]; then
              local LATEST
              LATEST="$(latest_patch_for_series "$STABLE_3_SERIES")"
              REF="v${LATEST}"
              SHA="$(sha_for_tag "$LATEST")"
            elif [ "$SLUG" = "2.7" ]; then
              # best-effort: cpython tags list may not include 2.7 in this repo/tag set
              REF="v2.7"
              SHA=""
            elif [ "$SLUG" = "2.6" ]; then
              REF="v2.6"
              SHA=""
            else
              local LATEST
              LATEST="$(latest_patch_for_series "$SLUG")"
              REF="v${LATEST}"
              SHA="$(sha_for_tag "$LATEST")"
            fi

            printf "%s %s %s\n" "$SLUG" "$REF" "$SHA"
          }

          # Process each numeric series (skip gracefully if no zip)
          while read -r S; do
            [ -z "$S" ] && continue
            download_docs_zip "$S" >> "$META"
          done <<< "$SERIES"

          # Add "3" alias
          download_docs_zip "3" >> "$META"

          # Add "dev" (use docs.python.org/dev/)
          download_docs_zip "dev" >> "$META"

          echo "Meta lines:" >&2
          cat "$META" >&2

          # ---------- Generate manifest.json ----------
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          TAG="offline-docs"
          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n \
            --arg generatedAt "$GENERATED_AT" \
            --arg releaseTag "$TAG" \
            '{
              generatedAt: $generatedAt,
              releaseTag: $releaseTag,
              versions: []
            }' > "$OUT_DIR/manifest.json"

          # Filter ONLY valid slugs: dev, 3, 2.6, 2.7, or X.Y
          awk '
            $1=="dev" || $1=="3" || $1=="2.6" || $1=="2.7" || $1 ~ /^[0-9]+\.[0-9]+$/ {print $0}
          ' "$META" | awk '!seen[$1]++' > "$OUT_DIR/meta.clean.txt"

          # Sort: dev first, then 3, then numeric desc
          awk '
            $1=="dev" {print "9999.9999 " $0; next}
            $1=="3"   {print "9998.9998 " $0; next}
            {split($1,a,"."); printf("%04d.%04d %s\n", a[1], a[2], $0)}
          ' "$OUT_DIR/meta.clean.txt" | sort -r | while read -r KEY SLUG REF SHA; do
            ASSET="python-docs-${SLUG}-en.zip"
            URL="https://github.com/${OWNER}/${REPO}/releases/download/${TAG}/${ASSET}"

            # pageUrl mapping
            if [ "$SLUG" = "dev" ]; then
              PAGE="https://docs.python.org/dev/"
            elif [ "$SLUG" = "3" ]; then
              PAGE="https://docs.python.org/3/"
            elif [ "$SLUG" = "2.6" ]; then
              PAGE="https://docs.python.org/release/2.6/"
            else
              PAGE="https://docs.python.org/${SLUG}/"
            fi

            jq \
              --arg slug "$SLUG" \
              --arg ref "$REF" \
              --arg sha "$SHA" \
              --arg zipUrl "$URL" \
              --arg pageUrl "$PAGE" \
              '.versions += [{slug:$slug, pageUrl:$pageUrl, zipUrl:$zipUrl, sha:$sha, ref:$ref}]' \
              "$OUT_DIR/manifest.json" > "$OUT_DIR/manifest.tmp.json"

            mv "$OUT_DIR/manifest.tmp.json" "$OUT_DIR/manifest.json"
          done

          MANIFEST_URL="https://github.com/${OWNER}/${REPO}/releases/download/${TAG}/manifest.json"
          jq --arg manifestUrl "$MANIFEST_URL" '.manifestUrl=$manifestUrl' \
            "$OUT_DIR/manifest.json" > "$OUT_DIR/manifest.tmp.json" && mv "$OUT_DIR/manifest.tmp.json" "$OUT_DIR/manifest.json"

          echo "Manifest final:" >&2
          cat "$OUT_DIR/manifest.json" >&2

      - name: Publish/Update Release assets (offline-docs)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-docs
          name: Offline Docs
          draft: false
          prerelease: false
          files: |
            out/*.zip
            out/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
